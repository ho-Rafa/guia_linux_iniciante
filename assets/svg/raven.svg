  <!-- corpo -->
  <path d="M60 150 Q52 95 100 86 Q150 92 142 150 Q138 182 100 184 Q62 182 60 150 Z" fill="url(#rvFeather)" stroke="#08080d" stroke-width="5" stroke-linejoin="round"/>
