    <circle cx="114" cy="70" r="15" fill="#fbfbfb" stroke="#08080d" stroke-width="3"/>
    <circle cx="89" cy="72" r="6.5" fill="#101018"/>
    <circle cx="111" cy="72" r="6.5" fill="#101018"/>
    <circle cx="87" cy="69" r="2" fill="#fff"/>
    <circle cx="109" cy="69" r="2" fill="#fff"/>
    <!-- bico -->
